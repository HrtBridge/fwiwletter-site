<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Past issues — For What It's Worth</title>
<meta name="description" content="Every past issue of For What It's Worth, the free weekly neighbor letter from northwest Missouri.">
<link rel="icon" type="image/png" href="assets/fwiw-icon.png">
<style>
  :root { --paper: #f7f2e7; --ink: #1a1a1a; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--paper); color: var(--ink);
    font-family: Georgia, 'Times New Roman', serif;
    line-height: 1.6; -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 680px; margin: 0 auto; padding: 40px 24px 64px; }
  .home-link { font-size: 0.95rem; }
  .home-link a { color: var(--ink); }
  .masthead { width: 100%; max-width: 480px; height: auto; display: block; margin: 16px auto 8px; }
  h1.page-title { text-align: center; font-weight: normal; font-size: 1.8rem; margin: 12px 0 4px; }
  .sub { text-align: center; font-style: italic; margin-bottom: 8px; }
  .rule { border: none; border-top: 1px solid var(--ink); width: 120px; margin: 28px auto; }
  .rule.full { width: 100%; }
  .toc { list-style: none; margin: 0 0 8px; }
  .toc li { margin: 10px 0; font-size: 1.05rem; }
  .toc a { color: var(--ink); }
  .toc .date { color: #555; font-size: 0.95rem; }
  article.issue { margin: 40px 0; }
  article.issue h2 { font-size: 1.5rem; font-weight: normal; margin-bottom: 2px; }
  article.issue .date { font-style: italic; color: #555; margin-bottom: 16px; }
  article.issue .body img { max-width: 100%; height: auto; }
  article.issue .body { overflow-wrap: break-word; }
  .empty { text-align: center; font-style: italic; margin: 32px 0; }
  .cta { text-align: center; margin-top: 40px; }
  .cta a { color: var(--ink); font-size: 1.1rem; }
  footer { margin-top: 56px; font-size: 0.9rem; color: #444; text-align: center; }
  footer a { color: var(--ink); }
  footer p { margin: 4px 0; }
</style>
</head>
<body>
  <div class="wrap">
    <p class="home-link"><a href="index.html">&larr; For What It's Worth</a></p>
    <img class="masthead" src="assets/fwiw-masthead.png" alt="For What It's Worth">
    <h1 class="page-title">Past issues</h1>
    <p class="sub">Every issue, newest first.</p>
    <hr class="rule">
    <p class="empty">No issues yet &mdash; the first one goes out soon.</p>

    <hr class="rule full">
    <div class="cta">
      <p><a href="index.html">Get future issues every Wednesday &rarr;</a></p>
    </div>
    <footer>
      <p>For What It's Worth &middot; a free weekly neighbor letter &middot; northwest Missouri</p>
      <p>Contact: <a href="mailto:brent@fwiwletter.com">brent@fwiwletter.com</a></p>
      <p>&copy; 2026 Brent Rosenauer</p>
    </footer>
  </div>
</body>
</html>
